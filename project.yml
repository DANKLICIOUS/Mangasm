name: MangasmiOS
options:
  bundleIdPrefix: com.mangasm
  deploymentTarget:
    iOS: "17.0"
packages:
  MangasmApp:
    path: .
configFiles:
  Debug: App/iOS/Secrets.xcconfig
  Release: App/iOS/Secrets.xcconfig
targets:
  Mangasm:
    type: application
    platform: iOS
    sources:
      - App/iOS
    dependencies:
      - package: MangasmApp
        product: MangasmApp
    entitlements:
      path: App/iOS/Mangasm.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: App/iOS/Info.plist
      properties:
        # $(VAR) expands from Secrets.xcconfig at build time. These MUST be
        # plist entries — Xcode ignores non-allowlisted INFOPLIST_KEY_* names,
        # which is how builds 20-22 shipped without Supabase config (B3 crash).
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        YELP_API_KEY: $(YELP_API_KEY)
        TICKETMASTER_API_KEY: $(TICKETMASTER_API_KEY)
        NSLocationWhenInUseUsageDescription: Mangasm uses your location to find restaurants and events within 10 miles of both of you for Date Night.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mangasm.app
        DEVELOPMENT_TEAM: 854XZ2543V
        # Manual App Store signing for swagger (Distribution cert + profile via ASC API).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Distribution: Mark Webster (854XZ2543V)"
        PROVISIONING_PROFILE_SPECIFIER: "Mangasm App Store 18"
        CODE_SIGN_ENTITLEMENTS: App/iOS/Mangasm.entitlements
        PRODUCT_NAME: Mangasm
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "31"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Mangasm
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: "#0A0612"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "6.0"
  MangasmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/iOS/Unit
      - path: Mangasm.storekit
        buildPhase: resources
    dependencies:
      - target: Mangasm
      - package: MangasmApp
        product: MangasmApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  MangasmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/iOS/UI
    dependencies:
      - target: Mangasm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  Mangasm:
    build:
      targets:
        Mangasm: all
        MangasmTests: [test]
        MangasmUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Mangasm.storekit
    test:
      config: Debug
      # StoreKitFlowTests drives StoreKit via SKTestSession (programmatic), so no
      # scheme-level storeKitConfiguration here (the two conflict).
      targets:
        - MangasmTests
        - MangasmUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
